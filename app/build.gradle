plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}


apply from: '../files/config/config.gradle'
apply from: '../files/config/flavor.gradle'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.seeksky.thebook"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    buildToolsVersion '33.0.2'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation "androidx.room:room-runtime:2.5.1"
    kapt "androidx.room:room-compiler:2.5.1"

//    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.tpGit2022:MPAndroidChart:v3.2.0'
//    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
////    implementation(name: 'MPChartLib_debug', ext: 'aar')
//    implementation(files('./libs/MPChartLib_debug.aar'))
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.7'

    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation 'com.blankj:utilcodex:1.30.0'

    implementation "io.reactivex.rxjava2:rxjava:2.2.19"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation "net.sourceforge.jexcelapi:jxl:2.6.12"
    implementation "com.guolindev.permissionx:permissionx:1.7.1"
    implementation "com.afollestad.material-dialogs:core:3.3.0"
}

  tasks.whenTaskAdded { task ->
        if (task.name.contains("ReleaseApkListingFileRedirect")) { // 过滤release
            task.enabled = false
        }
    }
